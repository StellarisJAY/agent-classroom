server:
  port: 8080
  mode: debug          # debug | release
  read_timeout: 10s
  write_timeout: 30s

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: agent_classroom
  sslmode: disable
  timezone: Asia/Shanghai
  # 连接池
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 1h

jwt:
  # AES-256-GCM 需要 32 字节 key，签发 JWT 用 HMAC-SHA256 至少 32 字节
  secret: "change-me-to-a-32-byte-secret-key"
  expire_hours: 24

cors:
  allowed_origins:
    - http://localhost:5173
  allowed_headers:
    - Authorization
    - Content-Type
  max_age: 86400

log:
  level: info          # debug | info | warn | error
  format: text         # text | json
