server:
  port: 8080
  mode: debug          # debug | release
  read_timeout: 10s
  # 覆盖 SSE 连接（讨论模式单流 agent loop 最多 8 轮 LLM 调用）
  write_timeout: 15m

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: agent_classroom
  sslmode: disable
  timezone: Asia/Shanghai
  # 连接池
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 1h

jwt:
  # AES-256-GCM 需要 32 字节 key，签发 JWT 用 HMAC-SHA256 至少 32 字节
  secret: "change-me-to-a-32-byte-secret-key"
  expire_hours: 24

cors:
  allowed_origins:
    - http://localhost:5173
  allowed_headers:
    - Authorization
    - Content-Type
  max_age: 86400

crypto:
  # 存储加密 API Key 的 32 字节密钥（AES-256-GCM），生产务必通过 APP_CRYPTO_ENCRYPTION_KEY 覆盖
  encryption_key: "change-me-to-a-32-byte-encryption-key"

model:
  # 平台全局可选模型清单：创建课程时下拉选择，支持配置多个。
  # key 唯一标识（落库复用，务必稳定）；kind 为 llm | image；label 为空回退 model。
  # default: true 的项作为该用途兜底模型（未选择课程模型时使用），每个 kind 至多一个；
  # 配图（kind=image）通常不设默认，未显式选择则不生成配图。
  options:
    - key: gpt-4o-mini
      kind: llm
      label: GPT-4o mini
      default: true
      provider: openai
      model: gpt-4o-mini
      base_url: https://api.openai.com/v1
      api_key: ""
    - key: deepseek-chat
      kind: llm
      label: DeepSeek Chat
      provider: deepseek
      model: deepseek-chat
      base_url: https://api.deepseek.com/v1
      api_key: ""
    - key: gpt-image-1
      kind: image
      label: GPT Image 1
      provider: openai
      model: gpt-image-1
      base_url: https://api.openai.com/v1
      api_key: ""
  # 非流式请求（大纲 / 环节内容生成）超时；思考模式 max 时自动放大 1.5 倍
  timeout: 300s
  # 流式请求（问答）超时；0 表示不限制，由上层 context 控制
  stream_timeout: 0s
  # 生成类调用（大纲 / 环节内容 / 文生图）失败重试：
  # max_attempts 总尝试次数（含首次）；base_backoff 首次重试前等待（0 = 立即重试），
  # 之后按指数递增；max_backoff 退避封顶（0 = 不封顶）
  retry:
    max_attempts: 2
    base_backoff: 0s
    max_backoff: 0s

extractor:
  # 提取链路：local 仅本地提取 | mineru 强制走 minerU | chain minerU 优先、本地兜底
  provider: chain
  # 注入提示词的参考文档 token 总预算（按 chars_per_token 换算成字符上限）
  max_doc_tokens: 20000
  # token≈字符 换算系数，中文约 1.5
  chars_per_token: 1.5
  # 大纲生成后台任务等待文档提取收敛的超时
  extract_timeout: 5m
  mineru:
    # base_url 为空走官方 API（官方 Go SDK）；自托管填 v4 兼容端点
    base_url: ""
    # 官方 API 管理令牌；为空回退免登录 Flash 提取（10MB/20 页限制）
    admin_token: ""
    timeout: 300s

storage:
  # 存储后端：local（本地磁盘）| minio
  type: local
  # type=local 时的根目录
  local_dir: ./data/uploads
  # type=minio 时生效（生产通过 APP_STORAGE_MINIO_* 覆盖密钥）
  minio:
    endpoint: localhost:9000
    access_key: ""
    secret_key: ""
    bucket: agent-classroom
    use_ssl: false
    region: us-east-1

log:
  level: info          # debug | info | warn | error
  format: text         # text | json
