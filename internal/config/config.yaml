server:
  port: 8080
  mode: debug          # debug | release
  read_timeout: 10s
  write_timeout: 30s

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: agent_classroom
  sslmode: disable
  timezone: Asia/Shanghai
  # 连接池
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 1h

jwt:
  # AES-256-GCM 需要 32 字节 key，签发 JWT 用 HMAC-SHA256 至少 32 字节
  secret: "change-me-to-a-32-byte-secret-key"
  expire_hours: 24

cors:
  allowed_origins:
    - http://localhost:5173
  allowed_headers:
    - Authorization
    - Content-Type
  max_age: 86400

crypto:
  # 存储加密 API Key 的 32 字节密钥（AES-256-GCM），生产务必通过 APP_CRYPTO_ENCRYPTION_KEY 覆盖
  encryption_key: "change-me-to-a-32-byte-encryption-key"

model:
  # 服务端统一兜底模型：用户未配置专属模型时使用（可通过 APP_MODEL_DEFAULT_* 覆盖）
  default:
    provider: openai
    model: gpt-4o-mini
    base_url: https://api.openai.com/v1
    api_key: ""
  # 非流式请求（大纲 / 环节内容生成）超时；思考模式 max 时自动放大 1.5 倍
  timeout: 300s
  # 流式请求（问答）超时；0 表示不限制，由上层 context 控制
  stream_timeout: 0s

extractor:
  # 提取链路：local 仅本地提取 | mineru 强制走 minerU | chain minerU 优先、本地兜底
  provider: chain
  # 注入提示词的参考文档 token 总预算（按 chars_per_token 换算成字符上限）
  max_doc_tokens: 20000
  # token≈字符 换算系数，中文约 1.5
  chars_per_token: 1.5
  # StartOutline 前置同步等待文档提取的超时
  extract_timeout: 5m
  mineru:
    # 部署形态：official 官方 API | selfhosted 自托管端点
    mode: official
    base_url: ""
    admin_token: ""
    timeout: 300s

storage:
  # 存储后端：local（本地磁盘）| minio
  type: local
  # type=local 时的根目录
  local_dir: ./data/uploads
  # type=minio 时生效（生产通过 APP_STORAGE_MINIO_* 覆盖密钥）
  minio:
    endpoint: localhost:9000
    access_key: ""
    secret_key: ""
    bucket: agent-classroom
    use_ssl: false
    region: us-east-1

log:
  level: info          # debug | info | warn | error
  format: text         # text | json
